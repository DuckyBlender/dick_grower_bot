[package]
name = "dick_grower_bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros"] }
rand = "0.10.3"
chrono = "0.4.45"
dotenvy = "0.15.7"
log = "0.4.34"
fern = { version = "0.7.1", features = ["colored"] }
